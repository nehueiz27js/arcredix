name: ARCREDIX Gmail watch renewal

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - name: Validate required secrets
        env:
          ARCREDIX_APP_URL: ${{ secrets.ARCREDIX_APP_URL }}
          ARCREDIX_CRON_SECRET: ${{ secrets.ARCREDIX_CRON_SECRET }}
        run: |
          test -n "$ARCREDIX_APP_URL" || { echo "Missing ARCREDIX_APP_URL secret"; exit 1; }
          test -n "$ARCREDIX_CRON_SECRET" || { echo "Missing ARCREDIX_CRON_SECRET secret"; exit 1; }
      - name: Renew Gmail watches
        env:
          ARCREDIX_APP_URL: ${{ secrets.ARCREDIX_APP_URL }}
          ARCREDIX_CRON_SECRET: ${{ secrets.ARCREDIX_CRON_SECRET }}
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            -H "Authorization: Bearer ${ARCREDIX_CRON_SECRET}" \
            "${ARCREDIX_APP_URL%/}/api/cron/gmail-watch"
