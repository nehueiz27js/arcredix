name: ARCREDIX quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate source and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/arcredix
      NEON_AUTH_BASE_URL: https://ci.invalid/auth
      NEON_AUTH_COOKIE_SECRET: ci-only-secret-that-is-longer-than-thirty-two-characters
      ARCREDIX_SUPERADMIN_EMAILS: ci@example.invalid
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check UTF-8 and mojibake
        run: npm run check:encoding

      - name: Unit tests
        run: npm test

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Production build
        run: npm run build
